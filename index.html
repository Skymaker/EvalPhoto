<script>
/* EvalPhoto Vanilla — full offline app */
(() => {
  "use strict";

  const APP_VERSION = "1.00.02";
  const DB_NAME = "evalphoto_html_db";
  const DB_VERSION = 1;
  const MAX_NODE_DEPTH = 2;
  const ZIP_WARN_BYTES = 300 * 1024 * 1024;
  const THUMB_SIZE_MIN = 48;
  const THUMB_SIZE_MAX = 120;
  const THUMB_SIZE_DEFAULT = 64;
  const THUMB_SIZE_STEP = 4;
  const THUMB_BORDER_MIN = 1;
  const THUMB_BORDER_WIDTH_DEFAULT = 3;
  const THUMB_BORDER_COLOR_DEFAULT = "#d4ff00";
  const EVAL_ICON_SIZE = 52;
  const SETTINGS_KEY = "evalphoto_html_settings";
  const MARKER_COLORS = ["#38bdf8", "#22c55e", "#f59e0b"];
  const NO_FOTO = "data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22400%22%20height%3D%22400%22%20viewBox%3D%220%200%20400%20400%22%3E%0A%3Crect%20fill%3D%22%23e8e6e1%22%20width%3D%22400%22%20height%3D%22400%22%2F%3E%0A%3Ctext%20x%3D%22200%22%20y%3D%22185%22%20text-anchor%3D%22middle%22%20fill%3D%22%23555%22%20font-family%3D%22system-ui%2Csans-serif%22%20font-size%3D%2228%22%20font-weight%3D%22600%22%3ENo%20hay%20Foto%3C%2Ftext%3E%0A%3Ctext%20x%3D%22200%22%20y%3D%22225%22%20text-anchor%3D%22middle%22%20fill%3D%22%23555%22%20font-family%3D%22system-ui%2Csans-serif%22%20font-size%3D%2228%22%20font-weight%3D%22600%22%3Epara%20el%20Riesgo%3C%2Ftext%3E%0A%3C%2Fsvg%3E";
  const SCHEMA_VERSION = "1.1";

  const uid = () => crypto.randomUUID();
  const now = () => Date.now();
  const startOfToday = () => {
    const d = new Date();
    d.setHours(12, 0, 0, 0);
    return d.getTime();
  };
  const formatSiteDate = (ms) =>
    new Date(ms).toLocaleDateString("es-ES", { day: "2-digit", month: "short", year: "numeric" });
  const esc = (s) =>
    String(s ?? "").replace(/[&<>"']/g, (c) =>
      ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c],
    );
  const clamp = (n, a, b) => Math.min(b, Math.max(a, n));

  function screenToPlan(sx, sy, pos, scale) {
    return { x: (sx - pos.x) / scale, y: (sy - pos.y) / scale };
  }
  function clampPlanCoord(x, y, w, h) {
    return { x: Math.min(Math.max(0, x), w), y: Math.min(Math.max(0, y), h) };
  }
  function remapCoord(x, y, fw, fh, tw, th) {
    if (fw <= 0 || fh <= 0) return { x, y };
    return { x: (x / fw) * tw, y: (y / fh) * th };
  }

  function defaultSettings() {
    return {
      thumbSizePx: THUMB_SIZE_DEFAULT,
      thumbBorderWidthPx: THUMB_BORDER_WIDTH_DEFAULT,
      thumbBorderColor: THUMB_BORDER_COLOR_DEFAULT,
      showHelpTexts: true,
    };
  }
  function loadSettings() {
    try {
      return { ...defaultSettings(), ...JSON.parse(localStorage.getItem(SETTINGS_KEY) || "{}") };
    } catch {
      return defaultSettings();
    }
  }
  function saveSettings(s) {
    localStorage.setItem(SETTINGS_KEY, JSON.stringify(s));
    applyThumbCss(s);
  }
  function applyThumbCss(s) {
    const root = document.documentElement;
    root.style.setProperty("--thumb-size", s.thumbSizePx + "px");
    root.style.setProperty("--thumb-border-width", s.thumbBorderWidthPx + "px");
    root.style.setProperty("--thumb-border-color", s.thumbBorderColor);

  async function compressImage(blob, maxSide = 1920, quality = 0.65) {
    const bmp = await createImageBitmap(blob);
    let { width: w, height: h } = bmp;
    const scale = Math.min(1, maxSide / Math.max(w, h));
    w = Math.max(1, Math.round(w * scale));
    h = Math.max(1, Math.round(h * scale));
    const canvas = document.createElement("canvas");
    canvas.width = w;
    canvas.height = h;
    canvas.getContext("2d").drawImage(bmp, 0, 0, w, h);
    bmp.close();
    let out = await new Promise((res, rej) =>
      canvas.toBlob((b) => (b ? res(b) : rej(new Error("toBlob"))), "image/webp", quality),
    );
    if (out.size > 512 * 1024 && quality > 0.4) {
      out = await new Promise((res, rej) =>
        canvas.toBlob((b) => (b ? res(b) : rej(new Error("toBlob"))), "image/webp", 0.45),
      );
    }
    return out;

  async function renderPlan(main) {
    let plan = await repo.syncPlanPixelSize(state.projectId, state.planId);
    if (!plan)
      plan = (await repo.listPlans(state.projectId)).find((p) => p.id === state.planId);
    if (!plan) {
      navigate("project", { projectId: state.projectId });
      return;
    }
    let nodes = (await repo.listNodes(state.projectId)).filter((n) => n.planId === state.planId);
    if (state.viewContextNodeId && !nodes.some((n) => n.id === state.viewContextNodeId)) {
      state.viewContextNodeId = null;
    }
    if (state.pendingChildParentId && !nodes.some((n) => n.id === state.pendingChildParentId)) {
      state.pendingChildParentId = null;
    }
    let contextNode = state.viewContextNodeId
      ? nodes.find((n) => n.id === state.viewContextNodeId)
      : null;
    if (contextNode && (!contextNode.photoWidth || !contextNode.photoHeight)) {
      await repo.ensureNodePhotoDimensions(state.projectId, contextNode.id);
      nodes = (await repo.listNodes(state.projectId)).filter((n) => n.planId === state.planId);
      contextNode = nodes.find((n) => n.id === state.viewContextNodeId);
    }
    const ctx = contextNode;
    const bgBlobId = ctx?.photoBlobId || plan.imageBlobId;
    const bgW = ctx ? ctx.photoWidth || 0 : plan.width;
    const bgH = ctx ? ctx.photoHeight || 0 : plan.height;
    const bgUrl = await blobUrl(bgBlobId);
    const visible = ctx
      ? nodes.filter((n) => n.parentId === ctx.id)
      : nodes.filter((n) => n.depth === 0);
    const pendingParent = state.pendingChildParentId
      ? nodes.find((n) => n.id === state.pendingChildParentId)
      : null;
    const chain = [];
    if (ctx) {
      let cur = ctx;
      while (cur) {
        chain.unshift(cur);
        cur = cur.parentId ? nodes.find((n) => n.id === cur.parentId) : null;
      }
    }
    const help = settings.showHelpTexts
      ? !ctx
        ? `<p class="plan-hint muted">Nivel 1 en el plano · 2 dedos: mover/zoom · 1 dedo libre: nuevo pin · pin: arrastrar</p>`
        : `<p class="plan-hint muted">Nivel ${ctx.depth + 2} en foto del nivel ${ctx.depth + 1} · mismos gestos</p>`
      : "";

    main.innerHTML = `
    <div class="page plan-page">
      <div class="plan-toolbar">
        <div class="plan-toolbar-row">
          ${iconLabelBtn("chevron-left", "nav-action", "Volver", { variant: "ghost", size: "sm", action: "back-project" })}
          <span class="plan-toolbar-title">${esc(plan.name)}</span>
        </div>
        <nav class="plan-breadcrumb">
          <span class="crumb-wrap"><button type="button" class="crumb ${!ctx ? "active" : ""}" data-ctx="">Plano</button></span>
          ${chain
            .map(
              (n, i) => `<span class="crumb-wrap"><span class="crumb-sep" aria-hidden="true">${icon("chevron-right", "crumb-sep")}</span>
            <button type="button" class="crumb ${i === chain.length - 1 ? "active" : ""}" data-ctx="${n.id}">${esc(n.code)}</button></span>`,
            )
            .join("")}
        </nav>
      </div>
      ${pendingParent ? `<p class="plan-hint">Toca la imagen para ubicar: ${esc(nodeListLabel(pendingParent))}</p>` : help}
      <div class="plan-layout">
        <div class="plan-canvas-wrap" id="canvas-wrap">
          <div id="stage" class="plan-stage">
            ${bgUrl ? `<img class="plan-bg" id="plan-bg" src="${bgUrl}" alt="" draggable="false" />` : `<div class="plan-bg-empty" id="plan-bg"></div>`}
            <div id="markers"></div>
          </div>
        </div>
        <aside class="plan-sidebar" id="plan-sidebar"></aside>
      </div>
    </div>`;

    const stage = main.querySelector("#stage");
    stage.style.cssText = `position:relative;transform-origin:0 0;width:${bgW}px;height:${bgH}px;touch-action:none;`;
    const bg = main.querySelector("#plan-bg");
    if (bg.tagName === "IMG") {
      bg.style.cssText = `display:block;width:${bgW}px;height:${bgH}px;user-select:none;-webkit-user-drag:none;`;
    } else {
      bg.style.cssText = `width:${bgW}px;height:${bgH}px;background:#1e293b;`;
    }
    main.querySelector("#canvas-wrap").style.cssText = `overflow:hidden;position:relative;background:#020617;min-height:280px;height:100%;cursor:${pendingParent ? "crosshair" : "grab"};`;
    main.querySelector("#markers").style.cssText =
      "position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;";

    main.querySelector('[data-action="back-project"]').onclick = () =>
      navigate("project", { projectId: state.projectId });
    main.querySelectorAll("[data-ctx]").forEach((b) => {
      b.onclick = () => {
        state.viewContextNodeId = b.getAttribute("data-ctx") || null;
        state.pendingChildParentId = null;
        state.userAdjusted = false;
        render();
      };
    });

    await renderMarkers(visible);
    await renderTree(main.querySelector("#plan-sidebar"), nodes);
    setupCanvasGestures(bgW, bgH, !!pendingParent, nodes);
    requestAnimationFrame(() => fitStage(bgW, bgH));
  }

  function fitStage(bgW, bgH) {
    if (state.userAdjusted) {
      applyStageTransform();
      return;
    }
    const wrap = document.getElementById("canvas-wrap");
    if (!wrap || bgW <= 0 || bgH <= 0) return;
    const w = wrap.clientWidth;
    const h = wrap.clientHeight;
    const scale = clamp(Math.min(w / bgW, h / bgH), 0.05, 8);
    state.stage = { scale, x: (w - bgW * scale) / 2, y: (h - bgH * scale) / 2 };
    applyStageTransform();
  }
  function applyStageTransform() {
    const stage = document.getElementById("stage");
    if (!stage) return;
    const { x, y, scale } = state.stage;
    stage.style.transform = `translate(${x}px,${y}px) scale(${scale})`;
    const inv = 1 / scale;
    stage.querySelectorAll(".marker").forEach((el) => {
      el.style.transform = `translate(-50%, 0) scale(${inv})`;
    });
  }

  async function renderMarkers(visible) {
    const host = document.getElementById("markers");
    if (!host) return;
    const inv = 1 / state.stage.scale;
    const html = [];
    for (const m of visible) {
      const color = MARKER_COLORS[m.depth % MARKER_COLORS.length];
      const selected = m.id === state.selectedNodeId;
      let thumb = `<span class="marker-thumb placeholder" aria-hidden="true"></span>`;
      if (m.photoBlobId) {
        const url = await blobUrl(m.photoBlobId);
        if (url) thumb = `<img class="marker-thumb" src="${url}" alt="" />`;
      }
      html.push(`<div class="marker ${selected ? "selected" : ""} depth-${m.depth}" data-marker="${m.id}" style="left:${m.x}px;top:${m.y}px;transform:translate(-50%,0) scale(${inv})">
        ${thumb}
        <span class="marker-badge" style="background:${selected ? "#0f172a" : color};${selected ? "outline:2px solid #f8fafc" : ""}">${esc(m.code)}</span>
      </div>`);
    }
    host.innerHTML = html.join("");
  }

  function setupCanvasGestures(bgW, bgH, placementMode, nodes) {
    const wrap = document.getElementById("canvas-wrap");
    if (!wrap) return;
    const clientToLocal = (cx, cy) => {
      const rect = wrap.getBoundingClientRect();
      return { x: cx - rect.left, y: cy - rect.top };
    };
    const pointerToPlan = (cx, cy) => {
      const local = clientToLocal(cx, cy);
      const p = screenToPlan(local.x, local.y, { x: state.stage.x, y: state.stage.y }, state.stage.scale);
      return clampPlanCoord(p.x, p.y, bgW, bgH);
    };

    wrap.onwheel = (e) => {
      e.preventDefault();
      const local = clientToLocal(e.clientX, e.clientY);
      const factor = e.deltaY > 0 ? 0.9 : 1.1;
      const newScale = clamp(state.stage.scale * factor, 0.05, 8);
      const focus = {
        x: (local.x - state.stage.x) / state.stage.scale,
        y: (local.y - state.stage.y) / state.stage.scale,
      };
      state.userAdjusted = true;
      state.stage = {
        scale: newScale,
        x: local.x - focus.x * newScale,
        y: local.y - focus.y * newScale,
      };
      applyStageTransform();
    };

    wrap.ontouchstart = (e) => {
      if (e.touches.length === 2) {
        const t0 = e.touches[0];
        const t1 = e.touches[1];
        pinch = {
          dist: Math.hypot(t1.clientX - t0.clientX, t1.clientY - t0.clientY),
          scale: state.stage.scale,
        };
        planDrag = null;
      }
    };
    wrap.ontouchmove = (e) => {
      if (e.touches.length === 2 && pinch) {
        e.preventDefault();
        const t0 = e.touches[0];
        const t1 = e.touches[1];
        const dist = Math.hypot(t1.clientX - t0.clientX, t1.clientY - t0.clientY);
        const newScale = clamp(pinch.scale * (dist / (pinch.dist || dist)), 0.05, 8);
        const center = { x: (t0.clientX + t1.clientX) / 2, y: (t0.clientY + t1.clientY) / 2 };
        const local = clientToLocal(center.x, center.y);
        const focus = {
          x: (local.x - state.stage.x) / state.stage.scale,
          y: (local.y - state.stage.y) / state.stage.scale,
        };
        state.userAdjusted = true;
        state.stage = {
          scale: newScale,
          x: local.x - focus.x * newScale,
          y: local.y - focus.y * newScale,
        };
        applyStageTransform();
      }
    };
    wrap.ontouchend = () => {
      pinch = null;
    };

    let panMoved = false;
    wrap.onpointerdown = (e) => {
      const markerEl = e.target.closest?.("[data-marker]");
      if (markerEl && !placementMode) {
        markerDrag = { id: markerEl.getAttribute("data-marker"), moved: false, pointerId: e.pointerId };
        wrap.setPointerCapture(e.pointerId);
        return;
      }
      if (!placementMode) {
        planDrag = {
          x: e.clientX,
          y: e.clientY,
          ox: state.stage.x,
          oy: state.stage.y,
          pointerId: e.pointerId,
        };
        panMoved = false;
        wrap.setPointerCapture(e.pointerId);
      } else {
        planDrag = { x: e.clientX, y: e.clientY, place: true, pointerId: e.pointerId };
        panMoved = false;
      }
    };
    wrap.onpointermove = (e) => {
      if (markerDrag && markerDrag.pointerId === e.pointerId) {
        markerDrag.moved = true;
        const coord = pointerToPlan(e.clientX, e.clientY);
        const el = document.querySelector('[data-marker="' + markerDrag.id + '"]');
        if (el) {
          el.style.left = coord.x + "px";
          el.style.top = coord.y + "px";
        }
        markerDrag.coord = coord;
        return;
      }
      if (planDrag && planDrag.pointerId === e.pointerId && !planDrag.place) {
        const dx = e.clientX - planDrag.x;
        const dy = e.clientY - planDrag.y;
        if (Math.hypot(dx, dy) > 10) panMoved = true;
        if (!panMoved) return;
        state.userAdjusted = true;
        state.stage.x = planDrag.ox + dx;
        state.stage.y = planDrag.oy + dy;
        applyStageTransform();
      }
    };
    wrap.onpointerup = async (e) => {
      if (markerDrag && markerDrag.pointerId === e.pointerId) {
        const id = markerDrag.id;
        const moved = markerDrag.moved;
        const coord = markerDrag.coord;
        markerDrag = null;
        if (moved && coord) {
          await repo.updateNode(state.projectId, id, { x: coord.x, y: coord.y });
        } else {
          const node = nodes.find((n) => n.id === id);
          state.selectedNodeId = id;
          if (node?.photoBlobId) {
            state.viewContextNodeId = id;
            state.userAdjusted = false;
          }
          render();
        }
        return;
      }
      if (planDrag && planDrag.pointerId === e.pointerId) {
        const wasPlace = planDrag.place || placementMode;
        const dx = e.clientX - planDrag.x;
        const dy = e.clientY - planDrag.y;
        planDrag = null;
        const tap = Math.hypot(dx, dy) < 10;
        if (wasPlace && tap) {
          await onPlanClick(pointerToPlan(e.clientX, e.clientY), nodes);
        } else if (!placementMode && !getViewContextNode(nodes) && tap && !panMoved) {
          await onPlanClick(pointerToPlan(e.clientX, e.clientY), nodes);
        }
      }
    };
  }

  async function onPlanClick(coord, nodes) {
    if (state.pendingChildParentId) {
      const parent = nodes.find((n) => n.id === state.pendingChildParentId);
      state.pendingChildParentId = null;
      if (!parent) {
        toast("No se encontró la observación padre", "error");
        return;
      }
      if (parent.depth >= MAX_NODE_DEPTH) {
        toast("No se pueden añadir más niveles", "error");
        return;
      }
      openNewNodeModal(parent, coord);
      return;
    }
    if (getViewContextNode(nodes)) return;
    openNewNodeModal(null, coord);
  }

  async function renderTree(aside, nodes) {
    const roots = nodes
      .filter((n) => n.depth === 0)
      .sort((a, b) => a.code.localeCompare(b.code, undefined, { numeric: true }));
    const byParent = new Map();
    for (const n of nodes) {
      if (!n.parentId) continue;
      const arr = byParent.get(n.parentId) || [];
      arr.push(n);
      byParent.set(n.parentId, arr);
    }
    for (const arr of byParent.values())
      arr.sort((a, b) => a.code.localeCompare(b.code, undefined, { numeric: true }));

    async function rowHtml(n) {
      const kids = byParent.get(n.id) || [];
      let thumb = `<span class="tree-thumb placeholder"></span>`;
      if (n.photoBlobId) {
        const url = await blobUrl(n.photoBlobId);
        if (url) thumb = `<img class="tree-thumb" src="${url}" alt="" />`;
      }
      const badges = [];
      if (n.notes?.trim()) badges.push(`<span class="tree-note-badge" title="Notas">${icon("note-text", "note-badge")}</span>`);
      if (n.audioBlobId) badges.push(`<span class="tree-note-badge" title="Audio">${icon("note-audio", "note-badge")}</span>`);
      const selected = n.id === state.selectedNodeId ? " selected" : "";
      let childrenHtml = "";
      if (kids.length) {
        childrenHtml = "<ul class='tree-children'>";
        for (const c of kids) childrenHtml += await rowHtml(c);
        childrenHtml += "</ul>";
      }
      return `<li>
      <div class="tree-row${selected}">
        <span class="tree-thumb-wrap">${thumb}</span>
        <button type="button" class="tree-label" data-select="${n.id}">
          <span class="tree-code">${esc(n.code)}</span>
          ${n.title ? `<span class="tree-alias">${esc(n.title)}</span>` : ""}
          ${badges.length ? `<span class="tree-note-badges">${badges.join("")}</span>` : ""}
        </button>
        ${iconBtn("edit", "tree-action", { variant: "ghost", size: "sm", action: "edit-node", extra: `data-id="${n.id}" title="Editar" aria-label="Editar"` })}
        ${n.depth < MAX_NODE_DEPTH ? iconBtn("plus", "tree-action", { variant: "ghost", size: "sm", action: "add-child", extra: `data-id="${n.id}" title="Añadir hijo" aria-label="Añadir hijo"` }) : ""}
        ${iconBtn("delete", "danger-action", { variant: "ghost", size: "sm", action: "del-node", extra: `data-id="${n.id}" title="Eliminar" aria-label="Eliminar"` })}
      </div>
      ${childrenHtml}
    </li>`;
    }

    let list = "<ul class='tree-root'>";
    for (const r of roots) list += await rowHtml(r);
    list += "</ul>";

    const selected = state.selectedNodeId
      ? nodes.find((n) => n.id === state.selectedNodeId)
      : null;
    let notesPanel = "";
    if (selected) {
      let photoHtml = "";
      let audio = "";
      if (selected.photoBlobId) {
        const url = await blobUrl(selected.photoBlobId);
        if (url) photoHtml = `<img class="node-photo-lg" src="${url}" alt="Foto ${esc(selected.code)}" />`;
      }
      if (selected.audioBlobId) {
        const url = await blobUrl(selected.audioBlobId);
        if (url) audio = `<audio class="audio-preview" controls src="${url}"></audio>`;
      }
      notesPanel = `<div class="node-notes-panel">
      <div class="node-notes-panel-header"><h3 class="section-title">Notas</h3>
        ${btn("Ampliar", { variant: "ghost", size: "sm", action: "review-node", extra: `data-id="${selected.id}"` })}
      </div>
      <p class="node-notes-panel-label muted">${esc(nodeListLabel(selected))}</p>
      ${photoHtml}
      <div class="node-notes-text">${esc(selected.notes || "(sin notas)")}</div>
      ${audio}
    </div>`;
    }

    aside.innerHTML = `<div class="node-tree">
    <div class="node-tree-header">
      <h2 class="section-title">Observaciones</h2>
      ${iconLabelBtn("plus", "tree-action", "Plano", { variant: "ghost", size: "sm", action: "add-root" })}
    </div>
    ${list || "<p class='muted'>Sin observaciones.</p>"}
    ${notesPanel}
  </div>`;

    aside.querySelector('[data-action="add-root"]')?.addEventListener("click", () => {
      state.viewContextNodeId = null;
      state.pendingChildParentId = null;
      state.userAdjusted = false;
      toast("Toca el plano para ubicar la observación");
      render();
    });

    aside.querySelectorAll("[data-select]").forEach((b) => {
      b.onclick = () => {
        state.selectedNodeId = b.getAttribute("data-select");
        render();
      };
    });
    aside.querySelectorAll('[data-action="add-child"]').forEach((b) => {
      b.onclick = () => {
        const parent = nodes.find((n) => n.id === b.getAttribute("data-id"));
        if (!parent) return;
        if (parent.depth >= MAX_NODE_DEPTH) {
          toast("No se pueden añadir más niveles", "error");
          return;
        }
        if (!parent.photoBlobId) {
          toast("El padre necesita foto para ubicar el detalle", "error");
          return;
        }
        state.viewContextNodeId = parent.id;
        state.pendingChildParentId = parent.id;
        state.userAdjusted = false;
        toast("Toca la foto del padre para ubicar el detalle");
        render();
      };
    });
    aside.querySelectorAll('[data-action="del-node"]').forEach((b) => {
      b.onclick = async () => {
        if (!confirm("¿Eliminar observación y sus hijos?")) return;
        const id = b.getAttribute("data-id");
        await repo.deleteNodeCascade(state.projectId, id);
        if (state.viewContextNodeId === id) state.viewContextNodeId = null;
        state.selectedNodeId = null;
        clearBlobCache();
        render();
      };
    });
    aside.querySelectorAll('[data-action="edit-node"]').forEach((b) => {
      b.onclick = () => openEditNodeModal(b.getAttribute("data-id"));
    });
    aside.querySelectorAll('[data-action="review-node"]').forEach((b) => {
      b.onclick = () => openReviewNodeModal(b.getAttribute("data-id"));
    });
  }

  function openModal(title, bodyHtml) {
    closeModal();
    const backdrop = document.createElement("div");
    backdrop.className = "modal-backdrop";
    backdrop.id = "modal";
    backdrop.innerHTML = `<div class="modal-panel"><div class="modal-header"><h2>${esc(title)}</h2>
    <button type="button" class="btn btn-ghost btn-sm modal-close-btn" id="modal-x" aria-label="Cerrar">${icon("close", "modal-close")}</button></div>
    <div class="modal-body">${bodyHtml}</div></div>`;
    document.body.appendChild(backdrop);
    backdrop.querySelector("#modal-x").onclick = closeModal;
    backdrop.addEventListener("click", (e) => {
      if (e.target === backdrop) closeModal();
    });
  }
  function closeModal() {
    document.getElementById("modal")?.remove();
  }


  function pickRecorderMimeType() {
    if (typeof MediaRecorder === "undefined") return undefined;
    const candidates = ["audio/webm;codecs=opus", "audio/webm", "audio/ogg;codecs=opus", "audio/mp4"];
    return candidates.find((t) => MediaRecorder.isTypeSupported(t));
  }
  function stopActiveRecorder(rec, stream) {
    try {
      if (rec && rec.state !== "inactive") rec.stop();
    } catch (_) {}
    stream?.getTracks().forEach((t) => t.stop());
  }
  function clearAudioEl(el) {
    if (!el) return;
    const prev = el.getAttribute("src");
    el.removeAttribute("src");
    el.load?.();
    el.hidden = true;
    if (prev && prev.startsWith("blob:")) {
      try { URL.revokeObjectURL(prev); } catch (_) {}
    }
  }

  async function openNewNodeModal(parent, coord) {
    const depth = parent ? parent.depth + 1 : 0;
    if (depth > MAX_NODE_DEPTH) {
      openModal(
        "Límite de profundidad",
        "<p>No se pueden añadir más de 3 niveles de observaciones.</p><div class='modal-actions'>" +
          btn("Cerrar", { variant: "ghost", action: "close-modal" }) +
          "</div>",
      );
      document.querySelector('[data-action="close-modal"]').onclick = closeModal;
      return;
    }
    const code = await repo.suggestCode(state.projectId, state.planId, parent?.id ?? null);
    openModal(
      parent ? "Nueva observación hija" : "Nueva observación",
      `
    <p class="muted">Nivel ${depth + 1}${parent ? " · sobre la foto del padre" : " · sobre el plano"} · (${Math.round(coord.x)}, ${Math.round(coord.y)})</p>
    <div class="node-photo-section">
      <span class="field-label">Foto <span class="required-mark">*</span></span>
      <div class="photo-actions">
        <label class="btn btn-sm btn-secondary">Subir foto<input type="file" accept="image/*" id="n-photo" hidden /></label>
        <button type="button" class="btn btn-sm btn-secondary" id="n-cam">Cámara</button>
        <button type="button" class="btn btn-sm btn-ghost" id="n-nophoto">Sin foto</button>
      </div>
      <div id="n-cam-box" hidden><video id="n-video" class="camera-preview" playsinline autoplay></video>
        <div class="photo-actions"><button type="button" class="btn btn-sm btn-primary" id="n-capture">Capturar</button>
        <button type="button" class="btn btn-sm btn-ghost" id="n-cam-close">Cerrar cámara</button></div></div>
      <img id="n-preview" class="photo-preview" hidden alt="" />
    </div>
    <p class="field-readonly"><span class="field-readonly-label">ID</span><span class="field-readonly-value">${esc(code)}</span>
      <span class="field-readonly-hint">Se asigna automáticamente y se muestra en el plano.</span></p>
    <label class="field"><span class="field-label">Alias (opcional)</span><input class="field-input" id="n-alias" placeholder="Texto corto, p. ej. Puerta norte" /></label>
    <label class="field"><span class="field-label">Notas</span><textarea class="field-textarea" id="n-notes" rows="4" placeholder="Descripción detallada…"></textarea></label>
    <div class="node-audio-section">
      <span class="field-label">Nota de voz (opcional)</span>
      <div class="photo-actions">
        <button type="button" class="btn btn-sm btn-secondary" id="n-rec">Grabar nota</button>
        <button type="button" class="btn btn-sm btn-ghost" id="n-rec-stop" hidden>Detener</button>
        <button type="button" class="btn btn-sm btn-ghost" id="n-rec-clear" hidden>Quitar</button>
      </div>
      <audio id="n-audio" class="audio-preview" controls hidden></audio>
    </div>
    <div class="modal-actions">
      ${btn("Cancelar", { variant: "ghost", action: "close-modal" })}
      <button type="button" class="btn btn-md btn-primary" data-action="save-node" disabled id="n-save">Guardar</button>
    </div>`,
    );
    let photo = null;
    let audio = null;
    let stream = null;
    let recorder = null;
    let chunks = [];
    const preview = document.getElementById("n-preview");
    const saveBtn = document.getElementById("n-save");
    const setPhoto = (blob) => {
      photo = blob;
      preview.hidden = !blob;
      if (blob) preview.src = URL.createObjectURL(blob);
      saveBtn.disabled = !blob;
    };
    document.querySelector('[data-action="close-modal"]').onclick = () => {
      stream?.getTracks().forEach((t) => t.stop());
      closeModal();
    };
    document.getElementById("n-photo").onchange = async (e) => {
      const f = e.target.files?.[0];
      if (!f) return;
      setPhoto(await compressImage(f));
    };
    document.getElementById("n-nophoto").onclick = async () => {
      try {
        setPhoto(await noFotoBlob());
      } catch (err) {
        console.error(err);
        toast("No se pudo crear el placeholder", "error");
      }
    };
    document.getElementById("n-cam").onclick = async () => {
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "environment" },
          audio: false,
        });
        document.getElementById("n-cam-box").hidden = false;
        document.getElementById("n-video").srcObject = stream;
      } catch {
        toast("No se pudo abrir la cámara", "error");
      }
    };
    document.getElementById("n-cam-close").onclick = () => {
      stream?.getTracks().forEach((t) => t.stop());
      document.getElementById("n-cam-box").hidden = true;
    };
    document.getElementById("n-capture").onclick = async () => {
      const v = document.getElementById("n-video");
      const c = document.createElement("canvas");
      c.width = v.videoWidth;
      c.height = v.videoHeight;
      c.getContext("2d").drawImage(v, 0, 0);
      const raw = await new Promise((r) => c.toBlob(r, "image/png"));
      setPhoto(await compressImage(raw));
      stream?.getTracks().forEach((t) => t.stop());
      document.getElementById("n-cam-box").hidden = true;
    };
    let audioStream = null;
    const syncAudioUi = () => {
      const has = !!audio;
      document.getElementById("n-rec").textContent = has ? "Grabar de nuevo" : "Grabar nota";
      document.getElementById("n-rec-clear").hidden = !has;
    };
    document.getElementById("n-rec").onclick = async () => {
      try {
        if (recorder && recorder.state !== "inactive") {
          stopActiveRecorder(recorder, audioStream);
          recorder = null;
          audioStream = null;
        }
        const mime = pickRecorderMimeType();
        if (!mime && typeof MediaRecorder === "undefined") {
          toast("Grabación no soportada en este navegador", "error");
          return;
        }
        audioStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        chunks = [];
        recorder = mime ? new MediaRecorder(audioStream, { mimeType: mime }) : new MediaRecorder(audioStream);
        const usedMime = recorder.mimeType || mime || "audio/webm";
        recorder.ondataavailable = (ev) => {
          if (ev.data?.size) chunks.push(ev.data);
        };
        recorder.onstop = () => {
          audioStream?.getTracks().forEach((t) => t.stop());
          audioStream = null;
          const blob = new Blob(chunks, { type: usedMime });
          document.getElementById("n-rec-stop").hidden = true;
          if (!blob.size) {
            toast("La grabación está vacía", "error");
            return;
          }
          audio = blob;
          const a = document.getElementById("n-audio");
          clearAudioEl(a);
          a.src = URL.createObjectURL(audio);
          a.hidden = false;
          syncAudioUi();
        };
        recorder.start();
        document.getElementById("n-rec-stop").hidden = false;
      } catch (err) {
        console.error(err);
        toast("No se pudo grabar audio", "error");
      }
    };
    document.getElementById("n-rec-stop").onclick = () => {
      stopActiveRecorder(recorder, audioStream);
    };
    document.getElementById("n-rec-clear").onclick = () => {
      stopActiveRecorder(recorder, audioStream);
      recorder = null;
      audioStream = null;
      audio = null;
      clearAudioEl(document.getElementById("n-audio"));
      syncAudioUi();
    };
    saveBtn.onclick = async () => {
      if (!photo) {
        toast("La foto es obligatoria", "error");
        return;
      }
      try {
        saveBtn.disabled = true;
        stopActiveRecorder(recorder, audioStream);
        stream?.getTracks().forEach((t) => t.stop());
        await repo.addNode(state.projectId, {
          parentId: parent?.id ?? null,
          planId: state.planId,
          x: coord.x,
          y: coord.y,
          title: document.getElementById("n-alias").value.trim(),
          notes: document.getElementById("n-notes").value.trim(),
          photo,
          audio,
          depth,
        });
        closeModal();
        toast("Observación guardada");
        render();
      } catch (err) {
        console.error(err);
        saveBtn.disabled = false;
        toast(err?.message || "No se pudo guardar", "error");
      }
    };
  }

          audio = blob;

          const a = document.getElementById("e-audio");
          clearAudioEl(a);
          a.src = URL.createObjectURL(audio);
          a.hidden = false;
          document.getElementById("e-rec").textContent = "Grabar de nuevo";
        };
        recorder.start();
        document.getElementById("e-rec-stop").hidden = false;
      } catch (err) {
        console.error(err);
        toast("No se pudo grabar", "error");
      }
    };
    document.getElementById("e-rec-stop").onclick = () => {
      stopActiveRecorder(recorder, audioStream);
    };
    document.getElementById("e-rec-clear").onclick = () => {
      stopActiveRecorder(recorder, audioStream);
      recorder = null;
      audioStream = null;
      audio = null;
      audioTouched = true;
      clearAudioEl(document.getElementById("e-audio"));
      document.getElementById("e-rec").textContent = "Grabar nota";
    };
    document.querySelector('[data-action="save-edit"]').onclick = async () => {
      try {
        stopActiveRecorder(recorder, audioStream);
        await repo.updateNode(state.projectId, nodeId, {
          title: document.getElementById("e-alias").value.trim(),
          notes: document.getElementById("e-notes").value.trim(),
          ...(photo ? { photo } : {}),
          ...(audioTouched ? { audio } : {}),
        });
        closeModal();
        clearBlobCache();
        render();
      } catch (err) {
        console.error(err);
        toast(err?.message || "No se pudo guardar", "error");
      }
    };
  }

  async function openReviewNodeModal(nodeId) {
    const node = await repo.getNode(state.projectId, nodeId);
    if (!node) return;
    let photo = "";
    let audio = "";
    if (node.photoBlobId) {
      const u = await blobUrl(node.photoBlobId);
      if (u) photo = `<img class="photo-preview" src="${u}" alt="" />`;
    }
    if (node.audioBlobId) {
      const u = await blobUrl(node.audioBlobId);
      if (u) audio = `<audio class="audio-preview" controls src="${u}"></audio>`;
    }
    openModal(
      nodeListLabel(node),
      `
    ${photo}
    <div class="node-notes-text">${esc(node.notes || "(sin notas)")}</div>
    ${audio}
    <div class="modal-actions">${btn("Cerrar", { variant: "ghost", action: "close-modal" })}</div>`,
    );
    document.querySelector('[data-action="close-modal"]').onclick = closeModal;
  }

  function imageExt(blob) {
    const t = (blob?.type || "").toLowerCase();
    if (t.includes("png")) return "png";
    if (t.includes("jpeg") || t.includes("jpg")) return "jpg";
    if (t.includes("svg")) return "svg";
    return "webp";
  }
  function audioExt(blob) {
    const t = (blob.type || "").toLowerCase();
    if (t.includes("ogg")) return "ogg";
    if (t.includes("mpeg") || t.includes("mp3")) return "mp3";
    return "webm";
  }

ren { padding-left: 1rem; }\n    .tree-row {\n      display: flex;\n      align-items: center;\n      gap: 0.35rem;\n      padding: 0.25rem 0;\n    }\n    .tree-row.selected { background: var(--bg); border-radius: 6px; }\n    .tree-thumb-wrap {\n      flex-shrink: 0;\n      width: var(--thumb-size);\n      height: var(--thumb-size);\n    }\n    .tree-thumb {\n      width: 100%;\n      height: 100%;\n      object-fit: cover;\n      border-radius: 4px;\n      border: var(--thumb-border-width) solid var(--thumb-border-color);\n      box-shadow: 0 0 6px rgba(212, 255, 0, 0.45);\n      display: block;\n      background: var(--bg);\n    }\n    .tree-thumb.placeholder { background: var(--border); }\n    .tree-toggle {\n      width: 1.5rem;\n      background: none;\n      border: none;\n      color: var(--muted);\n      cursor: pointer;\n      flex-shrink: 0;\n      display: inline-flex;\n      align-items: center;\n      justify-content: center;\n      padding: 0;\n    }\n    .tree-toggle.spacer { display: inline-block; }\n    .tree-label {\n      flex: 1;\n      text-align: left;\n      background: none;\n      border: none;\n      color: inherit;\n      cursor: pointer;\n      font-size: 0.875rem;\n      display: flex;\n      flex-direction: column;\n      gap: 0.1rem;\n      min-width: 0;\n      padding: 0;\n    }\n    .tree-code { font-weight: 700; color: var(--accent); font-size: 0.8rem; }\n    .tree-alias {\n      color: #cbd5e1;\n      font-size: 0.8rem;\n      overflow: hidden;\n      text-overflow: ellipsis;\n      white-space: nowrap;\n    }\n    .tree-note-badges { display: inline-flex; gap: 0.2rem; margin-top: 0.1rem; }\n    .tree-note-badge {\n      display: inline-flex;\n      align-items: center;\n      justify-content: center;\n      padding: 0.15rem 0.3rem;\n      border-radius: 3px;\n      background: var(--border);\n      color: var(--accent);\n    }\n    .ui-icon {\n      display: block;\n      flex-shrink: 0;\n    }\n    .ui-icon--tree-toggle {\n \"></div>\n        </div>\n        <aside class=\"plan-sidebar\">\n          <h3 class=\"section-title\">Observaciones</h3>\n          <ul class=\"tree-root\" id=\"tree-root\"></ul>\n          <section class=\"node-detail hidden\" id=\"node-detail\"></section>\n        </aside>\n      </div>\n    </div>\n    <p class=\"empty hidden\" id=\"no-plans\" style=\"padding:1rem\">No hay planos en esta evaluación.</p>\n    <footer id=\"footer\"></footer>\n  </div>\n  <script type=\"application/json\" id=\"eval-data\">__EVAL_DATA__<\/script>\n  <script>\n    (function () {\n      var data = JSON.parse(document.getElementById(\"eval-data\").textContent);\n\n      var state = {\n        planId: null,\n        viewContextId: null,\n        selectedId: null,\n        expanded: {},\n        imageSize: {},\n      };\n\n      function esc(s) {\n        if (s == null) return \"\";\n        return String(s)\n          .replace(/&/g, \"&amp;\")\n          .replace(/</g, \"&lt;\")\n          .replace(/>/g, \"&gt;\")\n          .replace(/\"/g, \"&quot;\");\n      }\n\n      function formatDate(iso) {\n        if (!iso) return \"\";\n        var d = new Date(iso);\n        if (isNaN(d.getTime())) return iso;\n        return d.toLocaleDateString(undefined, { year: \"numeric\", month: \"short\", day: \"numeric\" });\n      }\n\n      function flatten(nodes, out) {\n        (nodes || []).forEach(function (n) {\n          out.push(n);\n          flatten(n.children, out);\n        });\n      }\n\n      var allNodes = [];\n      flatten(data.nodes, allNodes);\n      var nodeById = {};\n      allNodes.forEach(function (n) { nodeById[n.id] = n; });\n\n      function childrenOf(parentId) {\n        return allNodes.filter(function (n) {\n          return n.parentId === parentId;\n        }).sort(function (a, b) {\n          return String(a.timestamp).localeCompare(String(b.timestamp));\n        });\n      }\n\n      function rootsForPlan(planId) {\n        return allNodes.filter(function (n) {\n          return n.planId === planId && n.parentId === null;\n        }).sort(function (a, b) {\n          return String(a.timestamp).localeCompare(String(b.timestamp));\n        });\n      }\n\n      function nodeLabel(n) {\n        var title = (n.title || \"\").trim();\n        return title ? n.code + \" — \" + title : n.code;\n      }\n\n      function hasNotes(n) {\n        return (n.notes && n.notes.trim()) || n.audio;\n      }\n\n      function currentPlan() {\n        return (data.plans || []).find(function (p) { return p.id === state.planId; });\n      }\n\n      function contextNode() {\n        return state.viewContextId ? nodeById[state.viewContextId] : null;\n      }\n\n      function visibleMarkers() {\n        if (!state.planId) return [];\n        if (state.viewContextId) return childrenOf(state.viewContextId);\n        return rootsForPlan(state.planId);\n      }\n\n      function breadcrumbChain() {\n        var ctx = contextNode();\n        if (!ctx) return [];\n        var chain = [];\n        var cur = ctx;\n        while (cur) {\n          chain.unshift(cur);\n          cur = cur.parentId ? nodeById[cur.parentId] : null;\n        }\n        return chain;\n      }\n\n      function getBg() {\n        var plan = currentPlan();\n        var ctx = contextNode();\n        if (ctx && ctx.photo) {\n          var size = state.imageSize[ctx.id];\n          return {\n            src: ctx.photo,\n            width: size ? size.width : plan ? plan.width : 1,\n            height: size ? size.height : plan ? plan.height : 1,\n            label: nodeLabel(ctx),\n          };\n        }\n        if (plan && plan.image) {\n          return {\n            src: plan.image,\n            width: plan.width,\n            height: plan.height,\n            label: plan.name,\n          };\n        }\n        return null;\n      }\n\n      function rememberImageSize(nodeId, img) {\n        if (!img.naturalWidth) return;\n        state.imageSize[nodeId] = { width: img.naturalWidth, height: img.naturalHeight };\n      }\n\n      function imageDisplayMetrics(img, logicalW, logicalH) {\n        var nw = img.naturalWidth || 1;\n        var nh = img.naturalHeight || 1;\n        var lw = logicalW > 0 ? logicalW : nw;\n        var lh = logicalH > 0 ? logicalH : nh;\n        var cw = img.clientWidth;\n        var ch = img.clientHeight;\n        var fit = Math.min(cw / nw, ch / nh);\n        var dw = nw * fit;\n        var dh = nh * fit;\n        return {\n          offsetX: (cw - dw) / 2,\n          offsetY: (ch - dh) / 2,\n          // Map stored coord space → natural pixels → CSS display\n          scaleX: (nw / lw) * fit,\n          scaleY: (nh / lh) * fit,\n        };\n      }\n\n      function fitStageToImage(img, stage) {\n        var wrap = stage.parentElement;\n        if (!wrap || !img.naturalWidth || !img.naturalHeight) return;\n        var maxW = Math.min(wrap.clientWidth, 640);\n        var maxH = wrap.clientHeight;\n        if (maxW <= 0 || maxH <= 0) return;\n        var scale = Math.min(maxW / img.naturalWidth, maxH / img.naturalHeight);\n        stage.style.width = Math.round(img.naturalWidth * scale) + \"px\";\n        stage.style.height = Math.round(img.naturalHeight * scale) + \"px\";\n      }\n\n      function iconHtml(name, context) {\n        var paths = {\n          \"chevron-right\": '<path d=\"m9 18 6-6-6-6\"/>',\n          \"chevron-down\": '<path d=\"m6 9 6 6 6-6\"/>',\n          \"note-text\": '<path d=\"M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z\"/><path d=\"M14 2v6h6\"/><path d=\"M16 13H8\"/><path d=\"M16 17H8\"/><path d=\"M10 9H8\"/>',\n          \"note-audio\": '<path d=\"M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z\"/><path d=\"M19 10v2a7 7 0 0 1-14 0v-2\"/><path d=\"M12 19v3\"/>'\n        };\n        return '<svg class=\"ui-icon ui-icon--' + context + '\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">' + (paths[name] || \"\") + '</svg>';\n      }\n\n      function renderHeader() {\n        var html = \"\";\n        if (data.site.icon) {\n          html += '<img class=\"site-icon\" src=\"' + esc(data.site.icon) + '\" alt=\"\" />';\n        }\n        html += '<div><p class=\"brand\"><span class=\"brand-eval\">Eval</span><span class=\"brand-photo\">Photo</span></p>';\n        html += '<h1>' + esc(data.site.name) + '</h1>';\n        html += '<p class=\"meta\">';\n        if (data.site.siteDate) html += 'Evaluación: ' + esc(formatDate(data.site.siteDate)) + ' · ';\n        html += 'Exportado: ' + esc(formatDate(data.exportedAt));\n        html += '</p></div>';\n        document.getElementById(\"site-header\").innerHTML = html;\n      }\n\n      function renderPlanTabs() {\n        var plans = (data.plans || []).slice().sort(function (a, b) {\n          return (a.sortOrder || 0) - (b.sortOrder || 0);\n        });\n        var tabs = document.getElementById(\"plan-tabs\");\n        var viewer = document.getElementById(\"viewer\");\n        var noPlans = document.getElementById(\"no-plans\");\n        if (!plans.length) {\n          tabs.innerHTML = \"\";\n          viewer.classList.add(\"hidden\");\n          noPlans.classList.remove(\"hidden\");\n          return;\n        }\n        noPlans.classList.add(\"hidden\");\n        viewer.classList.remove(\"hidden\");\n        if (!state.planId) state.planId = plans[0].id;\n        tabs.innerHTML = plans.map(function (p) {\n          var cls = p.id === state.planId ? \"plan-tab active\" : \"plan-tab\";\n          return '<button type=\"button\" class=\"' + cls + '\" data-plan=\"' + esc(p.id) + '\">' + esc(p.name) + '</button>';\n        }).join(\"\");\n        tabs.querySelectorAll(\".plan-tab\").forEach(function (btn) {\n          btn.addEventListener(\"click\", function () {\n            state.planId = btn.getAttribute(\"data-plan\");\n            state.viewContextId = null;\n            state.selectedId = null;\n            render();\n          });\n        });\n      }\n\n      function renderBreadcrumb() {\n        var el = document.getElementById(\"breadcrumb\");\n        var html = '<button type=\"button\" class=\"crumb' + (state.viewContextId ? \"\" : \" active\") + '\" data-context=\"\">Plano</button>';\n        breadcrumbChain().forEach(function (node, idx) {\n          var chain = breadcrumbChain();\n          var active = idx === chain.length - 1;\n          html += '<span class=\"crumb-sep\">›</span>';\n          html += '<button type=\"button\" class=\"crumb' + (active ? \" active\" : \"\") + '\" data-context=\"' + esc(node.id) + '\">' + esc(node.code) + '</button>';\n        });\n        el.innerHTML = html;\n        el.querySelectorAll(\".crumb\").forEach(function (btn) {\n          btn.addEventListener(\"click\", function () {\n            var id = btn.getAttribute(\"data-context\") || null;\n            state.viewContextId = id || null;\n            state.selectedId = id;\n            render();\n          });\n        });\n      }\n\n      function renderStage() {\n        var plan = currentPlan();\n        document.getElementById(\"viewer-title\").textContent = plan ? plan.name : \"\";\n        var hint = document.getElementById(\"plan-hint\");\n        if (!state.viewContextId) {\n          hint.textContent = \"Nivel 1 en el plano · clic en un pin con foto para entrar en la imagen\";\n        } else {\n          var ctx = contextNode();\n          hint.textContent = ctx\n            ? \"Nivel \" + (ctx.depth + 2) + \" en foto del nivel \" + (ctx.depth + 1) + \" · clic en pins para profundizar\"\n            : \"\";\n        }\n\n        var stage = document.getElementById(\"plan-stage\");\n        var bg = getBg();\n        if (!bg) {\n          stage.innerHTML = '<p class=\"empty\">Sin imagen de fondo.</p>';\n          stage.style.width = \"\";\n          stage.style.height = \"\";\n          return;\n        }\n\n        stage.style.width = \"\";\n        stage.style.height = \"\";\n        stage.innerHTML = '<img class=\"plan-bg content-image\" id=\"plan-bg\" src=\"' + esc(bg.src) + '\" alt=\"' + esc(bg.label) + '\" />';\n        var img = document.getElementById(\"plan-bg\");\n        var drawMarkers = function () {\n          if (contextNode()) rememberImageSize(contextNode().id, img);\n          fitStageToImage(img, stage);\n          var logical = getBg();\n          var metrics = imageDisplayMetrics(\n            img,\n            logical ? logical.width : 0,\n            logical ? logical.height : 0,\n          );\n          stage.querySelectorAll(\".marker\").forEach(function (m) { m.remove(); });\n          visibleMarkers().forEach(function (node) {\n            if (!node.coord) return;\n            var marker = document.createElement(\"div\");\n            marker.className = \"marker depth-\" + node.depth + (state.selectedId === node.id ? \" selected\" : \"\");\n            marker.style.left = (metrics.offsetX + node.coord.x * metrics.scaleX) + \"px\";\n            marker.style.top = (metrics.offsetY + node.coord.y * metrics.scaleY) + \"px\";\n            marker.title = nodeLabel(node);\n            if (node.photo) {\n              var thumb = document.createElement(\"img\");\n              thumb.className = \"marker-thumb\";\n              thumb.src = node.photo;\n              thumb.alt = \"\";\n              marker.appendChild(thumb);\n            } else {\n              var ph = document.createElement(\"span\");\n              ph.className = \"marker-thumb placeholder\";\n              marker.appendChild(ph);\n            }\n            var badge = document.createElement(\"span\");\n            badge.className = \"marker-badge\";\n            badge.textContent = node.code;\n            marker.appendChild(badge);\n            marker.addEventListener(\"click\", function (e) {\n              e.stopPropagation();\n              state.selectedId = node.id;\n              if (node.photo) state.viewContextId = node.id;\n              render();\n            });\n            stage.appendChild(marker);\n          });\n        };\n        if (img.complete) drawMarkers();\n        else img.addEventListener(\"load\", drawMarkers);\n      }\n\n      function renderTreeNode(node) {\n        var kids = childrenOf(node.id);\n        var expanded = state.expanded[node.id] !== false;\n        var html = '<li class=\"tree-node\">';\n        html += '<div class=\"tree-row' + (state.selectedId === node.id ? \" selected\" : \"\") + '\">';\n        html += '<div class=\"tree-thumb-wrap\">';\n        if (node.photo) {\n          html += '<img class=\"tree-thumb\" src=\"' + esc(node.photo) + '\" alt=\"\" />';\n        } else {\n          html += '<span class=\"tree-thumb placeholder\"></span>';\n        }\n        html += '</div>';\n        if (kids.length) {\n          html += '<button type=\"button\" class=\"tree-toggle\" data-toggle=\"' + esc(node.id) + '\" aria-label=\"Expandir\">' + iconHtml(expanded ? \"chevron-down\" : \"chevron-right\", \"tree-toggle\") + '</button>';\n        } else {\n          html += '<span class=\"tree-toggle spacer\"></span>';\n        }\n        html += '<button type=\"button\" class=\"tree-label\" data-select=\"' + esc(node.id) + '\">';\n        html += '<span class=\"tree-code\">' + esc(node.code) + '</span>';\n        if (node.title && node.title.trim()) {\n          html += '<span class=\"tree-alias\">' + esc(node.title.trim()) + '</span>';\n        }\n        if (hasNotes(node)) {\n          html += '<span class=\"tree-note-badges\">';\n          if (node.notes && node.notes.trim()) html += '<span class=\"tree-note-badge\" title=\"Notas de texto\">' + iconHtml(\"note-text\", \"note-badge\") + '</span>';\n          if (node.audio) html += '<span class=\"tree-note-badge\" title=\"Nota de voz\">' + iconHtml(\"note-audio\", \"note-badge\") + '</span>';\n          html += '</span>';\n        }\n        html += '</button></div>';\n        if (kids.length && expanded) {\n          html += '<ul class=\"tree-children\">';\n          kids.forEach(function (k) { html += renderTreeNode(k); });\n          html += '</ul>';\n        }\n        html += '</li>';\n        return html;\n      }\n\n      function renderTree() {\n        var roots = state.planId ? rootsForPlan(state.planId) : [];\n        var tree = document.getElementById(\"tree-root\");\n        if (!roots.length) {\n          tree.innerHTML = '<li><p class=\"empty\">Sin observaciones en este plano.</p></li>';\n          return;\n        }\n        tree.innerHTML = roots.map(renderTreeNode).join(\"\");\n        tree.querySelectorAll(\"[data-toggle]\").forEach(function (btn) {\n          btn.addEventListener(\"click\", function () {\n            var id = btn.getAttribute(\"data-toggle\");\n            state.expanded[id] = state.expanded[id] === false;\n            renderTree();\n            renderDetail();\n          });\n        });\n        tree.querySelectorAll(\"[data-select]\").forEach(function (btn) {\n          btn.addEventListener(\"click\", function () {\n            var id = btn.getAttribute(\"data-select\");\n            var node = nodeById[id];\n            state.selectedId = id;\n            if (node && node.photo) state.viewContextId = node.id;\n            render();\n          });\n        });\n      }\n\n      function renderDetail() {\n        var panel = document.getElementById(\"node-detail\");\n        var node = state.selectedId ? nodeById[state.selectedId] : null;\n        if (!node) {\n          panel.classList.add(\"hidden\");\n          panel.innerHTML = \"\";\n          return;\n        }\n        panel.classList.remove(\"hidden\");\n        var html = '<h4>' + esc(nodeLabel(node)) + '</h4>';\n        if (node.notes && node.notes.trim()) {\n          html += '<p class=\"node-notes\">' + esc(node.notes.trim()) + '</p>';\n        }\n        if (node.photo) {\n          html += '<img class=\"node-photo-lg content-image\" src=\"' + esc(node.photo) + '\" alt=\"Foto ' + esc(node.code) + '\" />';\n        }\n        if (node.audio) {\n          html += '<audio controls preload=\"metadata\" src=\"' + esc(node.audio) + '\"></audio>';\n        }\n        if (!hasNotes(node) && !node.photo) {\n          html += '<p class=\"empty\">Sin notas ni foto.</p>';\n        }\n        panel.innerHTML = html;\n      }\n\n      function render() {\n        renderPlanTabs();\n        if (!state.planId) return;\n        renderBreadcrumb();\n        renderStage();\n        renderTree();\n        renderDetail();\n      }\n\n      var resizeTimer;\n      window.addEventListener(\"resize\", function () {\n        clearTimeout(resizeTimer);\n        resizeTimer = setTimeout(function () {\n          if (state.planId) renderStage();\n        }, 120);\n      });\n\n      var stageWrap = document.querySelector(\".plan-stage-wrap\");\n      if (stageWrap && typeof ResizeObserver !== \"undefined\") {\n        var stageResizeTimer;\n        new ResizeObserver(function () {\n          clearTimeout(stageResizeTimer);\n          stageResizeTimer = setTimeout(function () {\n            if (state.planId) renderStage();\n          }, 80);\n        }).observe(stageWrap);\n      }\n\n      renderHeader();\n      render();\n      document.getElementById(\"footer\").textContent =\n        \"Visor offline EvalPhoto · schema \" + data.schemaVersion + \" · app \" + data.appVersion;\n    })();\n  <\/script>\n</body>\n</html>"
      .replace("__EVAL_DATA__", payload)
      .replace("__SITE_NAME__", siteName);
  }

  async function exportZip(projectId, onProgress) {
    onProgress?.("Leyendo proyecto", 0.05);
    const project = await repo.getProject(projectId);
    if (!project) throw new Error("Evaluación no encontrada");
    for (const p of await repo.listPlans(projectId)) await repo.syncPlanPixelSize(projectId, p.id);
    const plans = await repo.listPlans(projectId);
    const nodes = await repo.listNodes(projectId);
    const zip = new JSZip();
    let approx = 0;
    const planPaths = new Map();
    onProgress?.("Preparando archivos", 0.2);
    for (const p of plans) {
      const blob = await repo.getBlob(p.imageBlobId);
      const path = "assets/plans/" + p.id + "." + imageExt(blob);
      planPaths.set(p.id, path);
      zip.file(path, blob);
      approx += blob.size;
    }
    const photoPaths = new Map();
    const audioPaths = new Map();
    for (const n of nodes) {
      if (n.photoBlobId) {
        const blob = await repo.getBlob(n.photoBlobId);
        const path = "assets/photos/" + n.id + "." + imageExt(blob);
        photoPaths.set(n.id, path);
        zip.file(path, blob);
        approx += blob.size;
      }
      if (n.audioBlobId) {
        const blob = await repo.getBlob(n.audioBlobId);
        const path = "assets/audio/" + n.id + "." + audioExt(blob);
        audioPaths.set(n.id, path);
        zip.file(path, blob);
        approx += blob.size;
      }
    }
    let iconPath;
    if (project.iconBlobId) {
      const blob = await repo.getBlob(project.iconBlobId);
      iconPath = "assets/icon.webp";
      zip.file(iconPath, blob);
      approx += blob.size;
    }
    function toExport(n) {
      const kids = nodes
        .filter((x) => x.parentId === n.id)
        .sort((a, b) => a.timestamp - b.timestamp);
      return {
        id: n.id,
        parentId: n.parentId,
        planId: n.planId,
        coord: { x: n.x, y: n.y },
        timestamp: new Date(n.timestamp).toISOString(),
        code: n.code,
        title: n.title,
        notes: n.notes,
        photo: photoPaths.get(n.id) || "",
        ...(audioPaths.get(n.id) ? { audio: audioPaths.get(n.id) } : {}),
        depth: n.depth,
        children: kids.map(toExport),
      };
    }
    const roots = nodes.filter((n) => !n.parentId).sort((a, b) => a.timestamp - b.timestamp);
    const exportDoc = {
      schemaVersion: SCHEMA_VERSION,
      appVersion: APP_VERSION,
      exportedAt: new Date().toISOString(),
      site: {
        name: project.siteName,
        siteDate: new Date(project.siteDate).toISOString(),
        ...(iconPath ? { icon: iconPath } : {}),
      },
      plans: plans.map((p) => ({
        id: p.id,
        name: p.name,
        width: p.width,
        height: p.height,
        image: planPaths.get(p.id),
        sortOrder: p.sortOrder,
      })),
      nodes: roots.map(toExport),
    };
    onProgress?.("Generando visor HTML", 0.75);
    zip.file("project.json", JSON.stringify(exportDoc, null, 2));
    zip.file("index.html", buildReviewHtml(exportDoc));
    onProgress?.("Comprimiendo ZIP", 0.9);
    const zipBlob = await zip.generateAsync({ type: "blob" });
    const safe = (project.siteName || "proyecto").replace(/[^\w\-]+/g, "_");
    downloadBlob(zipBlob, safe + "_" + projectId.slice(0, 8) + ".zip");
    onProgress?.("Listo", 1);
    return zipBlob.size > ZIP_WARN_BYTES || approx > ZIP_WARN_BYTES;
  }

  async function importZip(file) {
    const zip = await JSZip.loadAsync(file);
    const jsonFile = zip.file("project.json");
    if (!jsonFile) throw new Error("ZIP sin project.json");
    const data = JSON.parse(await jsonFile.async("string"));
    if (!data.schemaVersion || !["1.0", "1.1"].includes(data.schemaVersion))
      throw new Error("schemaVersion no soportado");
    if (!data.site?.name) throw new Error("Sitio sin nombre");

    async function loadAsset(ref) {
      if (!ref) return null;
      if (ref.startsWith("assets/")) {
        const f = zip.file(ref);
        if (!f) throw new Error("Archivo no encontrado: " + ref);
        return f.async("blob");
      }
      if (ref.startsWith("data:")) {
        const res = await fetch(ref);
        return res.blob();
      }
      const clean = ref.includes(",") ? ref.slice(ref.indexOf(",") + 1) : ref;
      const bin = atob(clean);
      const bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      return new Blob([bytes], { type: "image/webp" });
    }

    const project = await repo.createProject(data.site.name);
    if (data.site.siteDate) {
      const p = await repo.getProject(project.id);
      p.siteDate = Date.parse(data.site.siteDate) || p.siteDate;
      await reqToPromise(tx(["projects"], "readwrite").objectStore("projects").put(p));
    }
    if (data.site.icon) {
      const icon = await loadAsset(data.site.icon);
      if (icon) await repo.updateProject(project.id, { icon: await compressImage(icon, 256, 0.7) });
    }

    const planIdMap = new Map();
    const planRemap = new Map();
    const sortedPlans = [...(data.plans || [])].sort(
      (a, b) => (a.sortOrder || 0) - (b.sortOrder || 0),
    );
    for (const p of sortedPlans) {
      const imageBlob = await loadAsset(p.image);
      if (!imageBlob) throw new Error("Plano sin imagen: " + p.name);
      const size = await blobPixelSize(imageBlob);
      if (p.width > 0 && p.height > 0 && (p.width !== size.width || p.height !== size.height)) {
        planRemap.set(p.id, {
          fromW: p.width,
          fromH: p.height,
          toW: size.width,
          toH: size.height,
        });
      }
      const plan = await repo.addPlan(project.id, {
        name: p.name,
        width: size.width,
        height: size.height,
        image: imageBlob,
      });
      planIdMap.set(p.id, plan.id);
    }

    async function walk(n, parentNew) {
      const planNew = planIdMap.get(n.planId);
      if (!planNew) throw new Error("planId desconocido");
      let photo = n.photo ? await loadAsset(n.photo) : null;
      if (!photo) photo = await noFotoBlob();
      else photo = await compressImage(photo);
      let audio = null;
      if (n.audio) audio = await loadAsset(n.audio);
      let x = n.coord.x;
      let y = n.coord.y;
      if (!parentNew) {
        const remap = planRemap.get(n.planId);
        if (remap) {
          const r = remapCoord(x, y, remap.fromW, remap.fromH, remap.toW, remap.toH);
          x = r.x;
          y = r.y;
        }
      }
      const depth = typeof n.depth === "number" ? n.depth : parentNew ? 1 : 0;
      const node = await repo.addNode(project.id, {
        parentId: parentNew,
        planId: planNew,
        x,
        y,
        title: (n.title || n.description || "").trim(),
        notes: (n.notes || "").trim(),
        photo,
        audio,
        depth,
      });
      if (n.code && n.code !== node.code) {
        node.code = n.code;
        await reqToPromise(tx(["nodes"], "readwrite").objectStore("nodes").put(node));
      }
      for (const c of (n.children || []).sort(
        (a, b) => Date.parse(a.timestamp) - Date.parse(b.timestamp),
      )) {
        await walk(c, node.id);
      }
    }
    for (const root of (data.nodes || []).sort(
      (a, b) => Date.parse(a.timestamp) - Date.parse(b.timestamp),
    )) {
      await walk(root, null);
    }
    return { projectId: project.id };
  }

  async function boot() {
    applyThumbCss(settings);
    await openDb();
    window.addEventListener("hashchange", parseHash);
    window.addEventListener("online", renderShell);
    window.addEventListener("offline", renderShell);
    document.getElementById("brand-btn").onclick = () => navigate("home");
    parseHash();
  }
  boot();
})();
